ansform:scale(1)}}.go:not(:disabled){animation:pulse 1.8s ease-in-out infinite}@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(232,64,28,.5)}50%{box-shadow:0 0 0 9px rgba(232,64,28,0)}}button:active:not(:disabled){transform:scale(.95)}.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}.conf span{position:absolute;top:-30px;font-size:1.6rem;animation:fall 3s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}.astro{opacity:0;animation:walk 1.5s ease-out forwards}@keyframes walk{0%{opacity:0;transform:translate(0,0)}10%{opacity:1}85%{opacity:1;transform:translate(var(--dx),var(--dy))}100%{opacity:0;transform:translate(var(--dx),var(--dy))}}.pop{opacity:0;animation:pop 1.2s 1.2s ease-out forwards}@keyframes pop{0%{opacity:0;transform:translateY(6px)}30%{opacity:1;transform:translateY(-6px)}75%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}.up{animation:upin .6s 1.3s both}@keyframes upin{from{opacity:0}to{opacity:1}}.seg{display:flex;gap:8px}.seg button{flex:1}.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surf)}@media (prefers-reduced-motion:reduce){.fill{transition:none}.tw{animation:none}.float{animation:none}.astro,.pop{display:none}.up{animation:none}.fly,.shoot,.drift,.bob,.blink,.mood,.ev,.go,.shake{animation:none}.conf{display:none}}

/* HORZONYX premium mission UI (theme tokens + polish) */
:root{--bg:#071326;--bg2:#0e2140;--surf:rgba(15,29,54,.94);--ink:#edf5ff;--mute:#9eb2d0;--line:rgba(135,171,220,.26);--acc:#ff754d;--accink:#190b08;--o2:#42b9ff;--pw:#ffd166;--sh:#bd8cff;--fd:#55e6a5;color-scheme:dark;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}

:root[data-theme="dark"]{--bg:#071326;--bg2:#0e2140;--surf:rgba(15,29,54,.94);--ink:#edf5ff;--mute:#9eb2d0;--line:rgba(135,171,220,.26);--acc:#ff754d;--accink:#190b08;--o2:#42b9ff;--pw:#ffd166;--sh:#bd8cff;--fd:#55e6a5;color-scheme:dark}
html{min-height:100%;background:var(--bg)}
body{min-height:100vh;background:radial-gradient(ellipse at 12% 0%,rgba(49,111,190,.2),transparent 38rem),linear-gradient(160deg,var(--bg),var(--bg2));background-color:var(--bg)}
main{max-width:680px;padding:clamp(16px,4vw,28px) clamp(14px,4vw,24px) 34px}
h1{font-size:clamp(1.85rem,5vw,2.55rem);letter-spacing:-.04em}

.fact{border:1px solid var(--acc)}

button:hover:not(:disabled){border-color:var(--acc);box-shadow:0 8px 20px rgba(0,0,0,.16)}
button:active:not(:disabled){transform:translateY(1px) scale(.985)}
button:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.go{border:1px solid var(--acc);border-radius:16px;background:linear-gradient(115deg,var(--acc),#ffa05a);color:var(--accink);box-shadow:0 10px 24px rgba(232,77,43,.28);font-weight:800}
.world{padding:12px;border-radius:19px;background:var(--surf)}
.world .sc{margin:0 0 12px}

/* ==========================================================================
   NASA SPACE APPS · MISSION-CONTROL SKIN
   Visual layer only: no markup, text or script is changed.
   ========================================================================== */
:root{--bg:#050b1a;--bg2:#0a1a38;--surf:rgba(13,27,54,.8);--ink:#eef5ff;--mute:#a1b5d4;--line:rgba(130,170,225,.22);--acc:#ff6a3d;--acc2:#ffa05a;--accink:#1a0a05;--o2:#4cc3ff;--pw:#ffd166;--sh:#c19bff;--fd:#5cf0ad;--glow:rgba(76,195,255,.38);--edge:rgba(140,195,255,.42);--n1:rgba(52,112,200,.30);--n2:rgba(130,80,210,.17);--n3:rgba(255,106,61,.15);--star-op:1;--limb-op:1;color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#e8f0fb;--bg2:#d3e2f6;--surf:rgba(255,255,255,.88);--ink:#10213d;--mute:#52668a;--line:rgba(60,95,150,.22);--acc:#e0401f;--acc2:#f0732f;--accink:#fff;--o2:#1478d4;--pw:#a87000;--sh:#7a3dcc;--fd:#14924f;--glow:rgba(20,120,212,.22);--edge:rgba(60,110,190,.38);--n1:rgba(80,140,230,.24);--n2:rgba(150,110,230,.13);--n3:rgba(255,140,90,.14);--star-op:0;--limb-op:0;color-scheme:light}}
:root[data-theme="light"]{--bg:#e8f0fb;--bg2:#d3e2f6;--surf:rgba(255,255,255,.88);--ink:#10213d;--mute:#52668a;--line:rgba(60,95,150,.22);--acc:#e0401f;--acc2:#f0732f;--accink:#fff;--o2:#1478d4;--pw:#a87000;--sh:#7a3dcc;--fd:#14924f;--glow:rgba(20,120,212,.22);--edge:rgba(60,110,190,.38);--n1:rgba(80,140,230,.24);--n2:rgba(150,110,230,.13);--n3:rgba(255,140,90,.14);--star-op:0;--limb-op:0;color-scheme:light}
:root[data-theme="dark"]{--bg:#050b1a;--bg2:#0a1a38;--surf:rgba(13,27,54,.8);--ink:#eef5ff;--mute:#a1b5d4;--line:rgba(130,170,225,.22);--acc:#ff6a3d;--acc2:#ffa05a;--accink:#1a0a05;--o2:#4cc3ff;--pw:#ffd166;--sh:#c19bff;--fd:#5cf0ad;--glow:rgba(76,195,255,.38);--edge:rgba(140,195,255,.42);--n1:rgba(52,112,200,.30);--n2:rgba(130,80,210,.17);--n3:rgba(255,106,61,.15);--star-op:1;--limb-op:1;color-scheme:dark}

/* ---- Deep-space backdrop: nebula, starfield, planet limb ---- */
html{background:radial-gradient(62rem 36rem at 8% -6%,var(--n1),transparent 70%),radial-gradient(44rem 30rem at 104% 22%,var(--n2),transparent 70%),radial-gradient(56rem 26rem at 50% 118%,var(--n3),transparent 72%),linear-gradient(172deg,var(--bg),var(--bg2));background-attachment:fixed;background-color:var(--bg);scrollbar-color:var(--line) transparent}
body{background:transparent}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:var(--star-op);
 background-image:
  radial-gradient(1px 1px at 23px 41px,#fff,transparent),
  radial-gradient(1px 1px at 131px 163px,rgba(255,255,255,.85),transparent),
  radial-gradient(1.4px 1.4px at 201px 77px,#cfe8ff,transparent),
  radial-gradient(1px 1px at 61px 297px,rgba(255,255,255,.75),transparent),
  radial-gradient(1.2px 1.2px at 283px 203px,#ffe9d2,transparent),
  radial-gradient(1px 1px at 347px 331px,rgba(255,255,255,.8),transparent),
  radial-gradient(1.8px 1.8px at 117px 411px,#fff,transparent),
  radial-gradient(1.6px 1.6px at 439px 129px,#bfe0ff,transparent);
 background-size:263px 263px,263px 263px,263px 263px,397px 397px,397px 397px,397px 397px,571px 571px,571px 571px}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:var(--limb-op);
 background:radial-gradient(ellipse 125% 39.4% at 50% 125%,#07183a 0 70%,rgba(130,214,255,.85) 71%,rgba(76,195,255,.24) 76%,transparent 87%)}
::selection{background:var(--acc);color:var(--accink)}

/* ---- Type ---- */
h1,h2,.alloc .n,.meter .row b,.menu button b,.world b,.opt b,.res span,.sq,.big{font-family:"Chakra Petch",Lexend,system-ui,sans-serif}
h1{font-weight:700;letter-spacing:-.01em;line-height:1.05;text-wrap:balance;text-shadow:0 2px 32px var(--glow)}
h2{font-weight:700;font-size:1.25rem;letter-spacing:0}
.mute{line-height:1.55}
a{color:var(--o2);text-underline-offset:3px;text-decoration-thickness:1px}
a:hover{color:var(--acc)}

/* ---- Mission viewport (every scene illustration) ---- */
.sc{border:1px solid var(--edge);border-radius:18px;outline:1px solid var(--line);outline-offset:4px;margin:14px 0 18px;box-shadow:0 24px 44px -20px rgba(0,0,0,.8),0 0 44px -12px var(--glow)}
.sc.stick{margin:8px 0 14px;box-shadow:0 0 0 4px var(--bg),0 14px 26px -8px rgba(0,0,0,.85)}
.world .sc{outline:0;margin:0 0 12px;box-shadow:0 14px 28px -14px rgba(0,0,0,.75);transition:transform .4s,filter .4s}
.world:hover .sc{transform:scale(1.02);filter:saturate(1.2) brightness(1.08)}

/* ---- Panels ---- */
.card{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,0) 42%),var(--surf);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:20px;box-shadow:0 22px 44px -26px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.07)}
.fact{border-color:color-mix(in srgb,var(--acc) 50%,transparent);background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 11%,transparent),transparent 48%),var(--surf)}
.fact::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--acc),var(--acc2) 60%,transparent)}
.warn{background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 16%,transparent),transparent 70%),var(--surf);border:1px solid color-mix(in srgb,var(--acc) 32%,var(--line));border-left:4px solid var(--acc);border-radius:14px}

/* ---- Buttons ---- */
button{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,0)),var(--surf);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 20px -12px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.08)}
button:hover:not(:disabled){transform:translateY(-1px);border-color:var(--acc);box-shadow:0 0 0 1px color-mix(in srgb,var(--acc) 45%,transparent),0 14px 28px -14px color-mix(in srgb,var(--acc) 70%,transparent)}
.go{background:linear-gradient(112deg,var(--acc),var(--acc2));border-color:color-mix(in srgb,var(--acc2) 65%,#fff);color:var(--accink);letter-spacing:.01em;box-shadow:0 16px 32px -12px color-mix(in srgb,var(--acc) 80%,transparent),inset 0 1px 0 rgba(255,255,255,.4)}
.go:hover:not(:disabled){filter:brightness(1.08);box-shadow:0 18px 36px -12px color-mix(in srgb,var(--acc) 90%,transparent),inset 0 1px 0 rgba(255,255,255,.45)}
@keyframes pulse{0%,100%{box-shadow:0 16px 32px -12px color-mix(in srgb,var(--acc) 80%,transparent),0 0 0 0 color-mix(in srgb,var(--acc) 55%,transparent)}50%{box-shadow:0 16px 32px -12px color-mix(in srgb,var(--acc) 80%,transparent),0 0 0 11px color-mix(in srgb,var(--acc) 0%,transparent)}}
.top button,main>#bk:not(.go){min-height:42px;padding:7px 16px;border-radius:999px;font-size:.95rem}
main>#bk:not(.go){margin-bottom:6px}
.seg{background:color-mix(in srgb,var(--line) 70%,transparent);border:1px solid var(--line);border-radius:16px}
.seg button[aria-pressed="true"]{background:linear-gradient(112deg,var(--acc),var(--acc2));color:var(--accink);box-shadow:0 8px 18px -8px color-mix(in srgb,var(--acc) 80%,transparent)}

/* ---- Home menu ---- */
.menu{gap:12px;margin:18px 0}
.menu button{min-height:68px;padding:12px 16px;gap:14px;border-radius:18px;font-size:1.1rem}
.menu .ic{display:grid;place-items:center;flex:none;width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-size:1.45rem}
.menu .go{grid-column:1/-1;min-height:84px;font-size:1.4rem}
.menu .go .ic{background:rgba(26,10,5,.2);border-color:rgba(26,10,5,.28)}
div[style*="text-align:center"] h1{font-size:clamp(2rem,8vw,3.2rem)}
.big{font-size:2.8rem;filter:drop-shadow(0 6px 22px var(--glow))}
.big.float{position:relative;z-index:0;padding:.2em .62em}
.big.float::before{content:"";position:absolute;inset:-14% -8%;z-index:-1;background:radial-gradient(closest-side,color-mix(in srgb,var(--acc) 40%,transparent),transparent 72%)}
.big.float::after{content:"";position:absolute;left:50%;top:50%;width:150%;height:44%;margin:-22% 0 0 -75%;z-index:-1;border-radius:50%;border:1.5px solid transparent;border-top-color:var(--o2);border-bottom-color:color-mix(in srgb,var(--acc) 70%,transparent);transform:rotate(-18deg)}

/* ---- Mission select ---- */
.world{padding:12px 12px 14px;border-radius:22px;transition:transform .25s,border-color .25s,box-shadow .25s}
.world:hover:not(:disabled){transform:translateY(-3px)}
.world b{font-size:1.22rem;letter-spacing:0}

/* ---- Meters (HUD gauges) ---- */
.meter{margin:14px 0}
.meter .row{align-items:baseline;margin-bottom:6px;font-size:.95rem}
.meter .row b{font-weight:600;font-variant-numeric:tabular-nums}
.low .bar{box-shadow:inset 0 1px 3px rgba(0,0,0,.55),0 0 0 1px color-mix(in srgb,var(--acc) 55%,transparent),0 0 16px -2px color-mix(in srgb,var(--acc) 40%,transparent)}
.bar{height:12px;overflow:visible;background:color-mix(in srgb,var(--line) 75%,transparent);box-shadow:inset 0 1px 3px rgba(0,0,0,.55)}
.fill{background-image:linear-gradient(180deg,rgba(255,255,255,.38),rgba(255,255,255,0) 58%),repeating-linear-gradient(90deg,transparent 0 10px,rgba(5,11,26,.32) 10px 12px)!important;box-shadow:0 0 14px -2px currentColor}
.fill[style*="var(--o2)"]{color:var(--o2)}
.fill[style*="var(--pw)"]{color:var(--pw)}
.fill[style*="var(--sh)"]{color:var(--sh)}
.fill[style*="var(--fd)"]{color:var(--fd)}
.fill[style*="var(--acc)"]{color:var(--acc)}
.top+.bar{height:10px}
.res{font-size:.92rem}
.res i{width:100px;flex:none;white-space:nowrap}
.res span{font-weight:600;font-variant-numeric:tabular-nums;min-width:3.2ch;text-align:right}
.mb{border-bottom:1px solid var(--line)}
.mb i{background-image:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,0))!important;border-radius:3px 3px 0 0}

/* ---- Worker-hours allocation ---- */
.alloc{padding:11px 0;gap:10px}
.alloc .t{font-size:1.02rem;font-weight:600}
.alloc .n{width:34px;font-size:1.5rem;font-weight:700}
.sq{width:48px;min-width:48px;height:48px;font-size:1.5rem;line-height:1;border-radius:14px}
.sq[data-k]{background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 30%,transparent),color-mix(in srgb,var(--acc) 12%,transparent));border-color:color-mix(in srgb,var(--acc) 62%,transparent);color:var(--acc)}

/* ---- Events & choices ---- */
.ev{filter:drop-shadow(0 0 18px rgba(255,160,90,.5))}
.opt{padding:15px 16px;margin:10px 0;border-radius:16px}
.opt b{font-size:1.08rem;font-weight:600}
.st{color:var(--mute);font-size:.95rem}

/* ---- Lists: real sequence gets real numbering ---- */
ol{padding:0;list-style:none;counter-reset:step}
ol li{counter-increment:step;position:relative;padding-left:42px;margin:12px 0;min-height:30px}
ol li::before{content:counter(step);position:absolute;left:0;top:-1px;display:grid;place-items:center;width:29px;height:29px;border-radius:50%;font:700 .9rem "Chakra Petch",Lexend,sans-serif;color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent);border:1px solid color-mix(in srgb,var(--acc) 55%,transparent)}
ul.f li::marker{color:var(--acc)}
ul.f li{margin:7px 0;line-height:1.55}

/* ---- Footer ---- */
footer{max-width:680px;border-top:1px solid var(--line);padding:18px 20px 36px;font-size:.82rem}

@media(max-width:390px){.menu .go{font-size:1.25rem}.menu button{padding:10px 12px}.sq{width:44px;min-width:44px}.alloc .n{width:28px}}
@media(prefers-reduced-motion:reduce){.go,.big,.float{animation:none}}

}

function meters(){return SYS.map(function(s){var v=Math.round(S.m[s.k]);return '<div class="meter'+(v<25?' low':'')+'"><div class="row"><span>'+s.i+' '+s.n+'</span><b>'+v+'%'+(v<25?' – low!':'')+'</b></div><div class="bar"><div class="fill" style="width:'+v+'%;background:'+COL[s.k]+'"></div></div></div>'}).join("")}
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function load(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
var ST=load("hz_set")||{sound:"on",big:"normal",theme:"auto"};
function applySet(){var r=document.documentElement;if(ST.theme==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",ST.theme);document.body.style.fontSize=ST.big==="large"?"1.25rem":""}
function save(){if(S){var a=S.anim;S.anim=null;store("hz_save",S);S.anim=a}}
function beep(f){if(ST.sound!=="on")return;try{var c=beep.c||(beep.c=new(window.AudioContext||window.webkitAudioContext)()),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=0.05;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+0.12)}catch(e){}}
document.addEventListener("click",function(e){if(e.target.closest&&e.target.closest("button"))beep(520)});
function find(t){return EV.filter(function(x){return x.t===t})[0]||null}
function cont(){var s=load("hz_save");if(!s||!W[s.w])return;S=s;if(S.fl!=null)applyFlare(S.fl);if(S.ev)S.ev=find(S.ev.t);if(S.pending){var p=S.pending;p.e=find(p.e&&p.e.t);if(!p.e)S.pending=null}draw()}
function home(){
 var sv=load("hz_save"),ok=sv&&W[sv.w],info=ok?W[sv.w].name+", day "+sv.sol:"No saved game yet";
 app.innerHTML=scene("moon",0,1)+'<div style="text-align:center"><p class="big float">🚀</p><h1>Junior Astronaut Mission Trainer</h1><p class="mute">Run a space base. Learn real NASA facts.</p></div><div class="menu"><button class="go" id="ng"><span class="ic">▶️</span><b>New game</b></button><button id="ct"'+(ok?'':' disabled')+'><span class="ic">⏯️</span><div><b>Continue</b><br><span>'+info+'</span></div></button><button id="st"><span class="ic">⚙️</span><b>Settings</b></button><button id="nd"><span class="ic">📡</span><b>NASA data</b></button><button id="ex"><span class="ic">🚪</span><b>Exit</b></button></div><p class="mute" style="text-align:center">Made by Team Horzonyx</p>';
 document.getElementById("ng").onclick=worlds;document.getElementById("ct").onclick=cont;document.getElementById("st").onclick=settings;document.getElementById("nd").onclick=dataScr;document.getElementById("ex").onclick=bye
}
function seg(k,o){return '<div class="seg">'+o.map(function(x){return '<button data-s="'+k+'" data-v="'+x[0]+'" aria-pressed="'+(ST[k]===x[0])+'">'+x[1]+'</button>'}).join("")+'</div>'}
function settings(){
 app.innerHTML='<button id="bk">← Menu</button><h1>⚙️ Settings</h1><div class="card"><h2>🔊 Sound</h2>'+seg("sound",[["on","On"],["off","Off"]])+'</div><div class="card"><h2>🔤 Text size</h2>'+seg("big",[["normal","Normal"],["large","Large"]])+'</div><div class="card"><h2>🎨 Colors</h2>'+seg("theme",[["auto","Auto"],["light","Light"],["dark","Dark"]])+'</div><div class="card"><h2>🗑️ Saved game</h2><p class="mute">Your game saves by itself on this device.</p><button id="rs">Delete saved game</button></div>';
 document.getElementById("bk").onclick=home;
 app.querySelectorAll("[data-s]").forEach(function(b){b.onclick=function(){ST[b.dataset.s]=b.dataset.v;store("hz_set",ST);applySet();settings()}});
 document.getElementById("rs").onclick=function(){if(this.dataset.c){store("hz_save",null);S=null;settings()}else{this.dataset.c=1;this.textContent="Tap again to delete"}}
}
function dataScr(){
 var X=FL.filter(function(f){return f[1][0]==="X"}).sort(function(a,b){return a[0]<b[0]?-1:1});
 var rows=X.map(function(f){var v=parseFloat(f[1].slice(1));return '<div class="res"><i>'+parseInt(f[0].slice(8,10),10)+' May '+f[0].slice(11,16)+'</i><div class="bar"><div class="fill" style="width:'+Math.round(v/8.7*100)+'%;background:var(--sh)"></div></div><span>'+f[1]+'</span></div>'}).join("");
 var avg=function(a){return(a.reduce(function(x,y){return x+y},0)/a.length).toFixed(1)};
 function mb(a,col){return '<div class="mb">'+a.map(function(v){return '<i style="height:'+Math.round((v-10)/10*100)+'%;background:'+col+'"></i>'}).join("")+'</div>'}
 function ul(a){return '<ul class="f">'+a.map(function(x){return '<li>'+x+'</li>'}).join("")+'</ul>'}
 app.innerHTML='<button id="bk">\u2190 Menu</button><h1>📡 NASA data</h1><p>Real NASA data used in this game, explained in simple words. They are saved copies, not a live feed.</p>'+
 '<div class="card"><h2>\u2600\uFE0F How big is a solar flare?</h2><p>A solar flare is a burst of energy from the Sun. Flares are sorted by letters: A, B, C, M and X. Each letter is 10 times stronger than the one before, so X is the strongest. The number after the letter is a finer step, like X8.7.</p></div>'+
 '<div class="card fact"><h2>\u2600\uFE0F Solar flares \u00b7 NASA DONKI</h2><p>DONKI is NASA\u2019s database of space weather. In the game, a flare alert picks one of 26 real flares from 8 to 14 May 2024 (12 X-class and 14 strong M-class). Each day report also shows the strongest flare of that real day. These are the 12 X-class flares, with the strongest at the bottom:</p>'+rows+'<p class="mute">Bar length compares flare strength. The strongest was X8.7 on 14 May at 16:51 UTC.</p></div>'+
 '<div class="card fact"><h2>🛰\uFE0F ISS radiation \u00b7 NASA OSDR RadLab</h2><p>Radiation is energy that can harm living things. Instruments inside the International Space Station measure how much an object soaks up, in \u00b5Gy (microgray) per hour. These are daily readings for 5\u201324 December 2019, from two places inside the ISS.</p>'+
 '<p><b>JPM module</b> (average '+avg(JPM)+', range 15.8\u201318.5)</p>'+mb(JPM,'var(--sh)')+'<p><b>Cupola</b> (average '+avg(CUP)+', range 13.2\u201315.4)</p>'+mb(CUP,'var(--o2)')+'<p class="mute">Every day the JPM module got more radiation than the Cupola. So where you stand in a base matters. Instruments: REM-JPM1FD4-pre and REM-CUPSSC17-pre.</p></div>'+
 '<div class="card"><h2>🔴 Mars \u00b7 NASA Science</h2>'+ul(["Mars is about half the size of Earth. Its radius is 3,390 km.","A Mars day (sol) is 24.6 hours. A Mars year is 687 Earth days.","It can reach 20 \u00b0C or fall to about \u2212153 \u00b0C.","The air is thin: mostly carbon dioxide, nitrogen and argon.","Dust storms can cover much of the planet and take months to settle.","Today there is ice near the poles and salty water that flows on some slopes in some seasons."])+'</div>'+
 '<div class="card"><h2>🌙 Moon \u00b7 NASA Science</h2>'+ul(["It is 384,400 km from Earth on average.","It spins once every 27.32 Earth days, the same as its orbit.","Gravity is 0.17 of Earth\u2019s.","Mean surface temperature: 107 \u00b0C by day, \u2212153 \u00b0C at night.","It has no atmosphere.","NASA found water ice, mostly in dark craters at the poles."])+'</div>'+
 '<div class="card"><h2>🔎 Explore more NASA resources</h2>'+ul(['<a href="https://api.nasa.gov" target="_blank" rel="noopener">NASA Open APIs</a>: free tools that give programs NASA data, like the Astronomy Picture of the Day, Mars rover photos and space weather.','<a href="https://osdr.nasa.gov" target="_blank" rel="noopener">NASA OSDR</a>: a library of space biology and astronaut health studies, such as bones, muscles and sleep.','<a href="https://trek.nasa.gov/mars/" target="_blank" rel="noopener">Mars Trek</a>: interactive maps of Mars made from NASA missions, including Curiosity and Perseverance.'])+'</div>'+
 '<div class="card"><h2>How the game uses it</h2><p>Real flare classes and dates appear in solar flare alerts and day reports. Real RadLab numbers appear in Space station day reports. Moon and Mars facts come from NASA pages. Meters and damage numbers are game design, not NASA measurements. Facts for the other worlds are general space facts.</p></div>'+
 '<div class="card"><h2>Sources</h2><p class="mute"><a href="https://ccmc.gsfc.nasa.gov/DONKI/" target="_blank" rel="noopener">NASA DONKI</a> (flare table, 8\u201314 May 2024)<br><a href="https://visualization.osdr.nasa.gov/radlab/" target="_blank" rel="noopener">NASA OSDR RadLab</a> (ISS daily dose rates, Dec 2019)<br><a href="https://science.nasa.gov/mars/facts/" target="_blank" rel="noopener">NASA Science: Mars Facts</a><br><a href="https://science.nasa.gov/moon/facts/" target="_blank" rel="noopener">NASA Science: Moon Facts</a><br>Learn more about food in space: Canadian Space Agency toolkit (<a href="https://asc-csa.gc.ca" target="_blank" rel="noopener">asc-csa.gc.ca</a>). Not NASA.<br>Retrieved November 2026.</p></div>';
 document.getElementById("bk").onclick=home
}
function bye(){
 app.innerHTML='<p class="big" style="text-align:center">👋</p><h1 style="text-align:center">Thanks for playing!</h1><div class="card"><p>Your game is saved. You can close this tab now, or come back any time to continue.</p><p class="mute">Made by Team Horzonyx for the NASA Space Apps Challenge.</p></div><button class="go" id="bk">Back to menu</button>';
 document.getElementById("bk").onclick=home
}
function worlds(){
 app.innerHTML='<button id="bk">← Menu</button><h1>New game</h1><p>Keep your astronauts safe on 8 different space bases for '+DAYS+' days.</p>'+
 '<div class="card"><h2>How to play</h2><ol><li>Each day you have <b>3 worker hours</b>.</li><li>Tap <b>+</b> to give hours. An astronaut will come out and upgrade your base!</li><li>Every system slowly drops each day. Do not let any reach 0%!</li></ol></div>'+
 '<h2>Pick your mission</h2>'+(load("hz_save")?'<p class="mute">Starting a new game replaces your saved game.</p>':'')+Object.keys(W).map(function(k){return '<button class="world" data-w="'+k+'">'+scene(k)+'<b>'+W[k].icon+' '+W[k].name+'</b><span class="mute">'+W[k].blurb+'</span></button>'}).join("")+
 '<div class="card"><h2>About this project</h2><p class="mute">Real space engineers must balance air, power, shields and food. This game lets you feel those choices. Every day shows a real fact from NASA science. Built by <b>Team Horzonyx</b>.</p></div>';
 app.querySelectorAll("[data-w]").forEach(function(b){b.onclick=function(){intro(b.dataset.w)}});document.getElementById("bk").onclick=home
}
function draw(){
 if(!S){home();return}
 save();if(S.pending){showFact();return}if(S.ev){drawEvent();return}
 var w=W[S.w],l=left(),warn="";
 if(night())warn+='<div class="warn">🌑 Moon night! Power drops faster today.</div>';
 if(S.m.pw<25)warn+='<div class="warn">⚡ Power is low, so Air and Food grow only half as much.</div>';
 if(S.m.sh<25)warn+='<div class="warn">🛡️ Shield is low. Radiation is getting dangerous!</div>';
 app.innerHTML='<div class="top"><button id="mn">☰ Menu</button><span>'+w.icon+' <b>'+w.name+'</b></span></div><div class="bar" role="img" aria-label="Mission progress"><div class="fill" style="width:'+Math.round((S.sol-1)/DAYS*100)+'%;background:var(--acc)"></div></div><p class="mute">Day '+S.sol+' of '+DAYS+'</p>'+
 scene(S.w,1)+'<p role="status" class="st'+(S.msg?' shake':'')+'">'+(S.anim?'🧑‍🚀 Upgrading '+SYS.filter(function(s){return s.k===S.anim})[0].n+'!':S.msg?'🧑‍🚀 Work cancelled. That hour is already used and does not come back.':'&nbsp;')+'</p>'+(S.note?'<p class="mute">'+S.note+'</p>':'')+'<div class="card">'+mood()+meters()+'</div>'+warn+
 '<div class="card"><h2>Give worker hours: '+"●".repeat(l)+"○".repeat(3-l)+' ('+l+' left)</h2><p class="mute">Choose carefully. The − button doesn’t give hours back.</p>'+
 SYS.map(function(s){return '<div class="alloc"><div class="t">'+s.i+' '+s.n+'<span>'+s.tip+(S.a[s.k]?' · +'+S.a[s.k]*25+'% at day end':'')+'</span></div><button class="sq" aria-label="Less '+s.n+'" data-m="'+s.k+'"'+(S.a[s.k]<1?' disabled':'')+'>−</button><div class="n">'+S.a[s.k]+'</div><button class="sq" aria-label="More '+s.n+'" data-k="'+s.k+'" data-d="1"'+(l<1?' disabled':'')+'>+</button></div>'}).join("")+
 '</div><button class="go" id="run"'+(l?' disabled':'')+'>'+(l?'Use all 3 hours to start':'Start day '+S.sol)+'</button>';
 S.anim=null;S.msg=null;app.querySelectorAll("[data-m]").forEach(function(b){b.onclick=function(){var k=b.dataset.m;if(S.a[k]>0)S.a[k]--;S.msg=1;var y=window.scrollY;draw();window.scrollTo(0,y);rf("data-m",k)}});app.querySelectorAll("[data-k]").forEach(function(b){b.onclick=function(){var k=b.dataset.k,d=+b.dataset.d;S.a[k]+=1;S.spent=(S.spent||0)+1;S.anim=k;var y=window.scrollY;draw();window.scrollTo(0,y);rf("data-k",k)}});
 document.getElementById("run").onclick=run;document.getElementById("mn").onclick=home
}
function fails(){var r={o2:["The air ran out","Air is the first thing mission planners protect."],pw:["The power ran out","Pumps, heaters and air cleaners all need electricity."],sh:["Radiation got too strong","Space has no thick air like Earth. Crews need shields and shelters."],fd:["The food ran out","Long missions need plants or stored food. Growing food also uses power and time."]};
 for(var k in r){if(S.m[k]<=0)return r[k]}return null}
function run(){
 var d=W[S.w].d,f=1+S.sol*0.05,eff=S.m.pw<25?0.5:1;
 SYS.forEach(function(s){var k=s.k,g=S.a[k]*25*((k==="o2"||k==="fd")?eff:1),x=Math.round(d[k]*f)+(night()&&k==="pw"?12:0);S.m[k]=clamp(S.m[k]+g-x);S.u[k]+=S.a[k];S.a[k]=0});S.spent=0;
 var fl=fails();if(fl)return end(false,fl);
 S.note="";
 var pool=EV.filter(function(e){return e.w==="both"||e.w===S.w});
 S.ev=pool[Math.floor(Math.random()*pool.length)];if(S.ev===EV[0])applyFlare(Math.floor(Math.random()*FL.length));
 draw()
}
function drawEvent(){save();
 var e=S.ev;
 app.innerHTML=scene(S.w,1)+'<div class="top"><h2>Day '+S.sol+' alert</h2></div><div class="card">'+mood()+meters()+'</div><div class="card"><p class="ev">'+EVI[EV.indexOf(e)]+'</p><h2>'+e.t+'</h2><p>'+e.x+'</p>'+
 e.c.map(function(c,i){return '<button class="opt" data-i="'+i+'"><b>'+c.n+'</b><span>'+chips(c.e)+'</span></button>'}).join("")+'</div>';
 app.querySelectorAll("[data-i]").forEach(function(b){b.onclick=function(){choose(+b.dataset.i)}})
}
function choose(i){
 var c=S.ev.c[i],e=S.ev,w=W[S.w],fa=w.facts[(S.sol-1)%w.facts.length];
 for(var k in c.e)S.m[k]=clamp(S.m[k]+c.e[k]);
 S.seen.push(e.f);S.seen.push(fa);
 var fl=fails();if(fl)return end(false,fl);
 S.ev=null;S.pending={e:e,c:c,fa:fa};showFact()
}
function showFact(){save();
 var p=S.pending;
 app.innerHTML='<h2>Day '+S.sol+' report</h2><div class="card">'+meters()+'</div><div class="card fact"><p class="ev">'+EVI[EV.indexOf(p.e)]+'</p><h2>'+(S.w==="moon"||S.w==="mars"?"🔭 NASA fact":"🔭 Space fact")+'</h2><p><b>'+p.e.t+'</b> '+p.e.f+'</p><p>'+p.fa+'</p>'+nasaExtra()+'</div><button class="go" id="nx">'+(S.sol>=DAYS?'Finish mission':'Go to day '+(S.sol+1))+'</button>';
 document.getElementById("nx").onclick=function(){S.note="You chose: "+p.c.n.toLowerCase()+".";S.pending=null;S.sol++;if(S.sol>DAYS)return end(true);draw()}
}
function confetti(){var d=document.createElement("div"),e=["⭐","🎉","🚀","✨"],h="",i;d.className="conf";d.setAttribute("aria-hidden","true");for(i=0;i<24;i++)h+='<span style="left:'+(i*4.3%100)+'%;animation-delay:'+(i%8*0.15)+'s">'+e[i%4]+'</span>';d.innerHTML=h;document.body.appendChild(d);setTimeout(function(){d.remove()},4500)}
function end(win,fl){store("hz_save",null);if(win)setTimeout(confetti,50);
 var avg=Math.round((S.m.o2+S.m.pw+S.m.sh+S.m.fd)/4),tot=0,w=W[S.w];
 for(var k in S.u)tot+=S.u[k];tot=tot||1;
 var rank=!win?"Cadet in training":avg>=70?"Mission Commander":avg>=45?"Flight Engineer":"Rookie Astronaut";
 var rep=SYS.map(function(s){var p=Math.round(S.u[s.k]/tot*100);return '<div class="res"><i>'+s.i+' '+s.n+'</i><div class="bar"><div class="fill" style="width:'+p+'%;background:'+COL[s.k]+'"></div></div><span>'+p+'%</span></div>'}).join("");
 var uniq=S.seen.filter(function(v,i,a){return a.indexOf(v)===i});
 app.innerHTML='<p class="big">'+(win?"🏆":"🛰️")+'</p><h1>'+(win?"Mission success!":"Mission over on day "+S.sol)+'</h1>'+
 '<div class="card"><p class="ev">'+(win?(avg>=70?"⭐⭐⭐":avg>=45?"⭐⭐":"⭐"):"☆☆☆")+'</p><h2>Your rank: '+rank+'</h2>'+(win?'<p>Your crew stayed safe for '+DAYS+' days at the '+w.name.toLowerCase()+'. Average system level: '+avg+'%.</p>':'<p><b>'+fl[0]+'.</b> '+fl[1]+' Try again and share your hours more evenly.</p>')+'</div>'+
 '<div class="card"><h2>Where your hours went</h2>'+rep+'<p class="mute">Helping one system means less help for the others. Real engineers make these trade-offs too.</p></div>'+
 (uniq.length?'<div class="card fact"><h2>Facts you learned</h2><ul class="f">'+uniq.map(function(f){return '<li>'+f+'</li>'}).join("")+'</ul></div>':'')+
 '<button class="go" id="again">Play again</button><br><br><button class="opt" id="menu"><b>Choose another world</b></button>';
 document.getElementById("again").onclick=function(){start(S.w)};
 document.getElementById("menu").onclick=function(){S=null;home()}
}
applySet();home();
</script>
</body>
